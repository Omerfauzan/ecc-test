<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>To-Do List</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label for="todo-input" class="visually-hidden">New task</label>
      <input id="todo-input" type="text" maxlength="200" placeholder="What needs doing?">
      <button type="submit">Add</button>
    </form>

    <p id="empty-state" class="empty-state">No tasks yet.</p>
    <ul id="todo-list" class="todo-list"></ul>
  </main>
</body>
</html>
